      #print-mount { display: none; }
      
      @media print {
        @page { 
          margin: 0; 
          size: auto;
        }
        html, body {
          margin: 0;
          padding: 0;
          background: #fff;
        }
        /* Esconde o App inteiro durante a impressão */
        #root { 
          display: none !important; 
        }
        /* Mostra apenas a área de montagem das fichas */
        #print-mount { 
          display: block !important; 
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          visibility: visible !important;
        }
        #print-mount * {
          visibility: visible !important;
        }
      }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

    </style>
